spring:
  datasource:
    url: jdbc:h2:mem:qrservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret

app:
  url: http://localhost:3000
  seed:
    branch-backfill: false
    package-catalog: false

ubereats:
  poll-enabled: false
  encrypt-key: dGVzdC10Z28tZW5jcnlwdC1rZXktMzItYnl0ZXMh
  webhook-api-key: test-webhook-key

ubereats-menu:
  encrypt-key: dGVzdC11YmVyZWF0cy1tZW51LWtleS0zMi1ieXRlcyEh

google:
  oauth:
    frontend-callback-url: http://localhost:3000/api/auth/google/callback
    handoff-ticket-ttl: PT2M
