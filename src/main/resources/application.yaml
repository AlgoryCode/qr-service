spring:
  application:
    name: algoryqr-service
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:5MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://185.184.210.52:5433/algoryqrdb-stage}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_stage}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 30000
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 600000
      minimum-idle: 2
      maximum-pool-size: 10
      validation-timeout: 3000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
          max-attempts: 3
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:977637390906-8uhh6hohv1o71gasg27tq5i4rpad54ef.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            authorization-grant-type: authorization_code
            redirect-uri: ${GOOGLE_CALLBACK_URL:http://localhost:8055/google-auth/callback}
            scope:
              - openid
              - profile
              - email

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  info:
    env:
      enabled: true


server:
  port: ${SERVER_PORT:8055}
  forward-headers-strategy: framework

app:
  url: ${APP_URL:http://localhost:3000}
  service-name: ${APP_SERVICE_NAME:qr-service}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  storage:
    filer-url: ${STORAGE_FILER_URL:http://localhost:8888}
    s3-endpoint: ${STORAGE_S3_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:qr-product-images}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8888/buckets/qr-product-images}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:5242880}
  menu:
    category-max-depth: ${MENU_CATEGORY_MAX_DEPTH:10}
  fulfillment:
    gate-mode: ${APP_FULFILLMENT_GATE_MODE:FULFILLMENT_ONLY}
  chef-avatars:
    items:
      - key: default
        label: Varsayılan Şef
        object-key: chief_avatars/default.png
        classpath-resource: chef-avatars/default.png
  seed:
    taxonomy: ${APP_SEED_TAXONOMY_ENABLED:false}
    package-catalog: ${APP_SEED_PACKAGE_CATALOG_ENABLED:false}
    public-access-backfill: ${APP_SEED_PUBLIC_ACCESS_BACKFILL_ENABLED:false}
    branch-backfill: ${APP_SEED_BRANCH_BACKFILL_ENABLED:true}
    fulfillment-entitlement-backfill: ${APP_SEED_FULFILLMENT_ENTITLEMENT_BACKFILL_ENABLED:true}
    chef-avatars: ${APP_SEED_CHEF_AVATARS_ENABLED:false}
    menu-products:
      enabled: ${APP_SEED_MENU_PRODUCTS_ENABLED:false}
      only-if-empty: ${APP_SEED_MENU_PRODUCTS_ONLY_IF_EMPTY:true}
  smart-report:
    quota-period: ${SMART_REPORT_QUOTA_PERIOD:DAY}
    quota-limit: ${SMART_REPORT_QUOTA_LIMIT:1}
    zone: ${SMART_REPORT_QUOTA_ZONE:Europe/Istanbul}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8080}
    pending-timeout-minutes: ${PAYMENT_PENDING_TIMEOUT_MINUTES:30}
    auth-token: ${PAYMENT_SERVICE_AUTH_TOKEN:6da7324f50e3d4dec722013510fd2c3ab5ce5c84ad7eb9af98bab23c2795db6e7761be271c480d41dd89c636305e027e}
    auth-header: ${PAYMENT_SERVICE_AUTH_HEADER:X-Service-Token}
    gateway-provider: ${PAYMENT_GATEWAY_PROVIDER:}
  rabbitmq:
    exchange: ${PAYMENT_EVENTS_EXCHANGE:payment.events}
    service-name: ${APP_SERVICE_NAME:qr-service}
    events-queue: ${PAYMENT_EVENTS_QUEUE:qr-service.payment.events}
    events-routing-key: ${PAYMENT_EVENTS_ROUTING_KEY:qr-service.payment.events}

smart-report:
  rabbitmq:
    queue: ${SMART_REPORT_QUEUE:smart_report.generate}
    events-exchange: ${SMART_REPORT_EVENTS_EXCHANGE:smart_report.events}
    events-queue: ${SMART_REPORT_EVENTS_QUEUE:qr-service.smart_report.events}
    events-routing-key: ${SMART_REPORT_EVENTS_ROUTING_KEY:smart_report.status}

billing:
  refund:
    monthly-cooling-days: ${BILLING_REFUND_MONTHLY_COOLING_DAYS:7}
    yearly-cooling-days: ${BILLING_REFUND_YEARLY_COOLING_DAYS:14}
    pending-stuck-minutes: ${BILLING_REFUND_PENDING_STUCK_MINUTES:15}
  subscription:
    manual-payment-grace-days: ${BILLING_SUBSCRIPTION_GRACE_DAYS:7}

trendyol-go:
  base-url: ${TGO_BASE_URL:https://api.tgoapis.com}
  user-agent-name: ${TGO_USER_AGENT_NAME:AlgoryQR}
  encrypt-key: ${TGO_CREDENTIALS_ENCRYPT_KEY:}
  connect-timeout: ${TGO_CONNECT_TIMEOUT:5s}
  read-timeout: ${TGO_READ_TIMEOUT:20s}
  max-attempts: ${TGO_MAX_ATTEMPTS:3}
  poll-enabled: ${TGO_POLL_ENABLED:true}
  poll-lookback-hours: ${TGO_POLL_LOOKBACK_HOURS:168}
  poll-page-size: ${TGO_POLL_PAGE_SIZE:50}
  webhook-api-key: ${TGO_WEBHOOK_API_KEY:}

odeal:
  enabled: ${ODEAL_ENABLED:true}
  base-url: ${ODEAL_BASE_URL:https://stage.odealapp.com/api/v1}
  merchant-key: ${ODEAL_MERCHANT_KEY:}
  secret-key: ${ODEAL_SECRET_KEY:}
  external-device-key: ${ODEAL_EXTERNAL_DEVICE_KEY:}
  default-vat-ratio: ${ODEAL_DEFAULT_VAT_RATIO:10}
  test-api-key: ${ODEAL_TEST_API_KEY:odeal-test-local}

jwt:
  secret: ${JWT_SECRET:algoryqr-service-jwt-secret-key-min-32-chars-long}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

google:
  oauth:
    frontend-callback-url: ${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:3000/api/auth/google/callback}
    handoff-ticket-ttl: ${GOOGLE_HANDOFF_TICKET_TTL:PT2M}
