spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: algoryqr-service
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:5MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://185.184.210.52:5433/algoryqrdb-stage}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_stage}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 30000
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 600000
      minimum-idle: 2
      maximum-pool-size: 10
      validation-timeout: 3000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
          max-attempts: 3

  flyway:
    enabled: true
    out-of-order: true
    validate-on-migrate: false
    ignore-missing-migrations: true
    ignore-migration-patterns: "*:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:977637390906-8uhh6hohv1o71gasg27tq5i4rpad54ef.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            authorization-grant-type: authorization_code
            redirect-uri: "${GOOGLE_CALLBACK_URL:http://localhost:${server.port:8080}/google-auth/callback}"
            scope:
              - openid
              - profile
              - email

jwt:
  secret: ${JWT_SECRET:algoryqr-service-jwt-secret-key-min-32-chars-long}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

google:
  oauth:
    # After Google: browser hits dashboard Next route (3000), which POSTs redeem to qr-service. Prod: {APP_URL}/api/auth/google/callback
    frontend-callback-url: ${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:3000/api/auth/google/callback}
    handoff-ticket-ttl: ${GOOGLE_HANDOFF_TICKET_TTL:PT2M}
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}
    post-login-redirect-path: ${GOOGLE_POST_LOGIN_REDIRECT_PATH:/login}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  info:
    env:
      enabled: true


server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  url: ${APP_URL:http://localhost:3000}
  service-name: ${APP_SERVICE_NAME:qr-service}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  email-verification:
    code-validity-minutes: ${EMAIL_VERIFICATION_CODE_VALIDITY_MINUTES:15}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    lock-minutes: ${EMAIL_VERIFICATION_LOCK_MINUTES:15}
  auth-gateway:
    rate-limit-enabled: ${AUTH_GATEWAY_RATE_LIMIT_ENABLED:true}
    login-max-failures: ${AUTH_GATEWAY_LOGIN_MAX_FAILURES:10}
    login-failure-window-minutes: ${AUTH_GATEWAY_LOGIN_FAILURE_WINDOW_MINUTES:15}
  storage:
    filer-url: ${STORAGE_FILER_URL:http://localhost:8888}
    s3-endpoint: ${STORAGE_S3_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:qr-product-images}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8888/buckets/qr-product-images}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:5242880}
  menu:
    category-max-depth: ${MENU_CATEGORY_MAX_DEPTH:10}
  fulfillment:
    repair-job-enabled: ${APP_FULFILLMENT_REPAIR_JOB_ENABLED:true}
    repair-job-batch-size: ${APP_FULFILLMENT_REPAIR_JOB_BATCH_SIZE:200}
    repair-job-fixed-delay-ms: ${APP_FULFILLMENT_REPAIR_JOB_FIXED_DELAY_MS:900000}
  chef-avatars:
    items:
      - key: default
        label: Varsayılan Şef
        object-key: chief_avatars/default.png
        classpath-resource: chef-avatars/default.png
  seed:
    taxonomy: ${APP_SEED_TAXONOMY_ENABLED:false}
    chef-avatars: ${APP_SEED_CHEF_AVATARS_ENABLED:false}
    menu-themes: ${APP_SEED_MENU_THEMES_ENABLED:false}
    menu-products:
      enabled: ${APP_SEED_MENU_PRODUCTS_ENABLED:false}
      only-if-empty: ${APP_SEED_MENU_PRODUCTS_ONLY_IF_EMPTY:true}
  smart-report:
    quota-period: ${SMART_REPORT_QUOTA_PERIOD:WEEK}
    quota-limit: ${SMART_REPORT_QUOTA_LIMIT:1}
    zone: ${SMART_REPORT_QUOTA_ZONE:Europe/Istanbul}

payment:
  service:
    pending-timeout-minutes: ${PAYMENT_PENDING_TIMEOUT_MINUTES:30}
    gateway-provider: ${PAYMENT_GATEWAY_PROVIDER:}
  gateway:
    default-provider: ${PAYMENT_GATEWAY_PROVIDER:PAYTR}
  token:
    encryption-key: ${PAYMENT_TOKEN_ENCRYPTION_KEY:prod-development-payment-token-key}
  events:
    exchange: ${PAYMENT_EVENTS_EXCHANGE:payment.events}
    allowed-service-names:
      - qr-service
      - algoryqr-web-site
  outbox:
    fixed-delay: ${PAYMENT_OUTBOX_FIXED_DELAY:5000}
  installments:
    fixed-delay: ${PAYMENT_INSTALLMENT_FIXED_DELAY:60000}
  subscriptions:
    fixed-delay: ${PAYMENT_SUBSCRIPTION_FIXED_DELAY:60000}
  reconciliation:
    fixed-delay: ${PAYMENT_RECONCILIATION_FIXED_DELAY:900000}
    stale-after-minutes: ${PAYMENT_RECONCILIATION_STALE_AFTER_MINUTES:10}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:50}
  verification-refund:
    fixed-delay: ${PAYMENT_VERIFICATION_REFUND_FIXED_DELAY:30000}
  callback:
    public-url: ${PAYMENT_CALLBACK_PUBLIC_URL:http://127.0.0.1:${SERVER_PORT:8080}}
    checkout-form-public-url: ${PAYMENT_CHECKOUT_FORM_CALLBACK_PUBLIC_URL:http://127.0.0.1:${SERVER_PORT:8080}/payments/paytr/notification}
    frontend-redirect-url: ${PAYMENT_FRONTEND_REDIRECT_URL:http://localhost:3000/payment/result}
    card-verification-frontend-redirect-url: ${PAYMENT_CARD_VERIFICATION_FRONTEND_REDIRECT_URL:http://localhost:3000/dashboard/hesabim/kayitli-kartlarim}
  rabbitmq:
    exchange: ${PAYMENT_EVENTS_EXCHANGE:payment.events}
    service-name: ${APP_SERVICE_NAME:qr-service}
    events-queue: ${PAYMENT_EVENTS_QUEUE:qr-service.payment.events}
    events-routing-key: ${PAYMENT_EVENTS_ROUTING_KEY:qr-service.payment.events}

menu:
  rabbitmq:
    exchange: ${MENU_EVENTS_EXCHANGE:menu.events}
    product-index-routing-key: ${MENU_PRODUCT_INDEX_ROUTING_KEY:menu.product.changed}
    publish-enabled: ${MENU_EVENTS_PUBLISH_ENABLED:true}

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
  connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
  read-timeout: ${AI_SERVICE_READ_TIMEOUT:60s}
  reindex-batch-size: ${AI_SERVICE_REINDEX_BATCH_SIZE:100}

batch-reports:
  reconcile-interval-ms: ${BATCH_REPORTS_RECONCILE_INTERVAL_MS:60000}

integration:
  rabbitmq:
    exchange: ${INTEGRATION_EVENTS_EXCHANGE:integration.events}
    ai-requested-queue: ${INTEGRATION_AI_REQUESTED_QUEUE:integration.ai.requested}
    ai-requested-routing-key: ${INTEGRATION_AI_REQUESTED_ROUTING_KEY:integration.ai.requested}
    ai-completed-queue: ${INTEGRATION_AI_COMPLETED_QUEUE:qr-service.integration.ai.completed}
    ai-completed-routing-key: ${INTEGRATION_AI_COMPLETED_ROUTING_KEY:integration.ai.completed}
    publish-queue: ${INTEGRATION_PUBLISH_QUEUE:qr-service.integration.publish.requested}
    publish-routing-key: ${INTEGRATION_PUBLISH_ROUTING_KEY:integration.publish.requested}

smart-report:
  rabbitmq:
    queue: ${SMART_REPORT_QUEUE:smart_report.generate}
    events-exchange: ${SMART_REPORT_EVENTS_EXCHANGE:smart_report.events}
    events-queue: ${SMART_REPORT_EVENTS_QUEUE:qr-service.smart_report.events}
    events-routing-key: ${SMART_REPORT_EVENTS_ROUTING_KEY:smart_report.status}

billing:
  refund:
    monthly-cooling-days: ${BILLING_REFUND_MONTHLY_COOLING_DAYS:7}
    yearly-cooling-days: ${BILLING_REFUND_YEARLY_COOLING_DAYS:14}
    pending-stuck-minutes: ${BILLING_REFUND_PENDING_STUCK_MINUTES:15}
  subscription:
    manual-payment-grace-days: ${BILLING_SUBSCRIPTION_GRACE_DAYS:7}

ubereats:
  base-url: ${UBEREATS_BASE_URL:https://api.tgoapis.com}
  user-agent-name: ${UBEREATS_USER_AGENT_NAME:AlgoryQR}
  encrypt-key: ${UBEREATS_CREDENTIALS_ENCRYPT_KEY:}
  connect-timeout: ${UBEREATS_CONNECT_TIMEOUT:5s}
  read-timeout: ${UBEREATS_READ_TIMEOUT:20s}
  max-attempts: ${UBEREATS_MAX_ATTEMPTS:3}
  poll-enabled: ${UBEREATS_POLL_ENABLED:true}
  poll-lookback-hours: ${UBEREATS_POLL_LOOKBACK_HOURS:168}
  poll-page-size: ${UBEREATS_POLL_PAGE_SIZE:50}
  webhook-api-key: ${UBEREATS_WEBHOOK_API_KEY:}
  paths:
    restaurant-menu-upsert: ${UBEREATS_MENU_UPSERT_PATH:/integrator/product/meal/suppliers/{sellerId}/stores/{restaurantId}/products}
    restaurant-menu-upsert-method: ${UBEREATS_MENU_UPSERT_METHOD:POST}

yemeksepeti:
  base-url: ${YEMEKSEPETI_BASE_URL:https://yemeksepeti.partner.deliveryhero.io}
  encrypt-key: ${YEMEKSEPETI_CREDENTIALS_ENCRYPT_KEY:}
  connect-timeout: ${YEMEKSEPETI_CONNECT_TIMEOUT:5s}
  read-timeout: ${YEMEKSEPETI_READ_TIMEOUT:20s}
  max-attempts: ${YEMEKSEPETI_MAX_ATTEMPTS:3}
  poll-enabled: ${YEMEKSEPETI_POLL_ENABLED:true}
  poll-lookback-hours: ${YEMEKSEPETI_POLL_LOOKBACK_HOURS:168}

ubereats-menu:
  api-base-url: ${UBEREATS_MENU_API_BASE_URL:${UBEREATS_API_BASE_URL:https://api.uber.com}}
  auth-url: ${UBEREATS_MENU_AUTH_URL:${UBEREATS_AUTH_URL:https://login.uber.com/oauth/v2/token}}
  encrypt-key: ${UBEREATS_MENU_CREDENTIALS_ENCRYPT_KEY:}
  connect-timeout: ${UBEREATS_MENU_CONNECT_TIMEOUT:${UBEREATS_CONNECT_TIMEOUT:5s}}
  read-timeout: ${UBEREATS_MENU_READ_TIMEOUT:${UBEREATS_READ_TIMEOUT:30s}}
  max-attempts: ${UBEREATS_MENU_MAX_ATTEMPTS:${UBEREATS_MAX_ATTEMPTS:3}}
  default-scope: ${UBEREATS_MENU_DEFAULT_SCOPE:${UBEREATS_DEFAULT_SCOPE:eats.store}}

odeal:
  enabled: ${ODEAL_ENABLED:true}
  base-url: ${ODEAL_BASE_URL:https://stage.odealapp.com/api/v1}
  merchant-key: ${ODEAL_MERCHANT_KEY:}
  secret-key: ${ODEAL_SECRET_KEY:}
  external-device-key: ${ODEAL_EXTERNAL_DEVICE_KEY:}
  default-vat-ratio: ${ODEAL_DEFAULT_VAT_RATIO:10}
  test-api-key: ${ODEAL_TEST_API_KEY:odeal-test-local}

paytr:
  merchant-id: ${PAYTR_MERCHANT_ID:}
  merchant-key: ${PAYTR_MERCHANT_KEY:}
  merchant-salt: ${PAYTR_MERCHANT_SALT:}
  base-url: ${PAYTR_BASE_URL:https://www.paytr.com}
  test-mode: ${PAYTR_TEST_MODE:true}
  debug-on: ${PAYTR_DEBUG_ON:true}
  timeout-limit-minutes: ${PAYTR_TIMEOUT_LIMIT_MINUTES:30}

push-notification:
  messaging:
    exchange: ${PUSH_NOTIFICATION_EXCHANGE:push-notification-exchange}
    routing-key: ${PUSH_NOTIFICATION_ROUTING_KEY:push-notification.request}
  channels: mail,telegram
  payment-subject: ${PUSH_NOTIFICATION_PAYMENT_SUBJECT:Ödeme Onayı}

