spring:
  application:
    name: algoryqr-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://185.184.210.52:5432/algoryqrdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:AdHqvxNc8MLBsMjOi82TjDzSMSuUDptBNjFVwpsvtVoaf6YOciJxqT84KgmBgc39}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 30000
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 600000
      minimum-idle: 2
      maximum-pool-size: 10
      validation-timeout: 3000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: ${GOOGLE_CALLBACK_URL:{baseUrl}/google-auth/callback}
            scope:
              - openid
              - profile
              - email

  flyway:
    enabled: true
    out-of-order: true
    validate-on-migrate: false
    ignore-missing-migrations: true
    ignore-migration-patterns: "*:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  info:
    env:
      enabled: true


server:
  port: ${SERVER_PORT:8055}
  forward-headers-strategy: framework

app:
  url: ${APP_URL:http://localhost:3000}
  stage-trial-fixture:
    enabled: ${STAGE_TRIAL_FIXTURE_ENABLED:true}
    template-user-id: ${STAGE_TRIAL_TEMPLATE_USER_ID:0}
    template-branch-id: ${STAGE_TRIAL_TEMPLATE_BRANCH_ID:0}
    template-menu-id: ${STAGE_TRIAL_TEMPLATE_MENU_ID:0}

payment:
  service:
    gateway-provider: ${PAYMENT_GATEWAY_PROVIDER:PAYTR}

jwt:
  secret: ${JWT_SECRET:algoryqr-service-jwt-secret-key-min-32-chars-long}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

google:
  oauth:
    frontend-callback-url: ${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:3000/api/auth/google/callback}
    handoff-ticket-ttl: ${GOOGLE_HANDOFF_TICKET_TTL:PT2M}
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}

auth:
  service:
    public-base-url: ${AUTH_SERVICE_PUBLIC_BASE_URL:https://stage.auth.algorycode.com}

fulfillment:
  external:
    enabled: ${FULFILLMENT_EXTERNAL_ENABLED:true}
    base-url: ${FULFILLMENT_SERVICE_URL:https://stage.fulfillment.algorycode.com}
    auth-token: ${FULFILLMENT_SERVICE_AUTH_TOKEN:}
    auth-header: ${FULFILLMENT_SERVICE_AUTH_HEADER:X-Service-Token}
