name: Deploy to Staging

on:
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Repository & Commit Hash
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_HASH=${GITHUB_SHA::7}
          echo "IMAGE_BASE=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${COMMIT_HASH}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_BASE }}:staging

      - name: Update Coolify Application Image Tag
        run: |
          curl -X PATCH "http://185.184.210.52:8000/api/v1/applications/jf3herc4muflonhlmrlqn60v" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\": \"${{ env.IMAGE_TAG }}\"}"

      - name: Trigger Staging Coolify Deploy
        run: |
          curl -X GET "http://185.184.210.52:8000/api/v1/deploy?uuid=jf3herc4muflonhlmrlqn60v&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
