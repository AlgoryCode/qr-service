name: Deploy to Staging

on:
  workflow_dispatch: # Sadece manuel butonla çalışır

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Kullanıcı ve repo adını küçük harfe çevirme + Hash alma
      - name: Set Lowercase Repository & Commit Hash
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_HASH=${GITHUB_SHA::7}
          echo "IMAGE_BASE=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "Küçük Harf Depo Adı: ghcr.io/${REPO_LOWER}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_BASE }}:staging

      - name: Trigger Staging Coolify
        run: |
          curl -X GET "${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}&tag=${{ env.IMAGE_TAG }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
