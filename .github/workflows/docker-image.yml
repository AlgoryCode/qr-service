name: Deploy to Staging

on:
  workflow_dispatch: # Sadece manuel butonla çalışır

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Short Commit Hash
        id: versioning
        run: |
          COMMIT_HASH=${GITHUB_SHA::7}
          echo "IMAGE_TAG=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "Ortam: STAGING | Commit Hash: ${COMMIT_HASH}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:staging

      - name: Trigger Staging Coolify
        run: |
          curl -X GET "${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}"
